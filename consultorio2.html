<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de llamadas</title>
    <link rel="stylesheet" href="consultorio2.css">
</head>

<body>
    <div class="container">
        <h1>Calculadora de llamadas</h1>

        <label for="minutos">Minutos hablados:</label>
        <input type="number" id="minutos" min="1" placeholder="Ejemplo: 5">

        <label for="zona">Zona geográfica:</label>
        <select id="zona">
      <option value="2.10">América del Norte (S/ 2.10/min)</option>
      <option value="2.60">América Central (S/ 2.60/min)</option>
      <option value="4.50">América del Sur (S/ 4.50/min)</option>
      <option value="3.60">Europa (S/ 3.60/min)</option>
      <option value="6.00">Asia (S/ 6.00/min)</option>
      <option value="6.50">África (S/ 6.50/min)</option>
      <option value="3.90">Oceanía (S/ 3.90/min)</option>
    </select>

        <button id="btnCalcular">Calcular</button>

        <p id="resultado">Costo total: S/ 0.00</p>
    </div>

    <script>
        const minutos = document.getElementById("minutos");
        const zona = document.getElementById("zona");
        const resultado = document.getElementById("resultado");
        const btn = document.getElementById("btnCalcular");

        btn.addEventListener("click", () => {
            const min = parseFloat(minutos.value) || 0;
            const precio = parseFloat(zona.value);
            const total = (min * precio).toFixed(2);
            resultado.textContent = `Costo total: S/ ${total}`;
        });
    </script>
</body>

</html>
